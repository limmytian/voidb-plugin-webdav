[[capabilities]]
id = "copy"
description = "COPY a WebDAV resource with explicit overwrite, depth, and ETag preconditions."
input_schema = "schemas/copy-input.schema.json"
output_schema = "schemas/copy-output.schema.json"
permissions = [
    "connection.write",
    "webdav.copy",
]
risk = "destructive"
destructive = true

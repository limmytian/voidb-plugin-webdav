[[capabilities.authorization.approval_schema.fields]]
path = "/path"
label = "Remote path or prefix"
value_type = "path"
required = false
constraint = "prefix"
risk_emphasis = "normal"

[[capabilities]]
id = "stat"
description = "Read metadata for one WebDAV item."
input_schema = "schemas/stat-input.schema.json"
output_schema = "schemas/stat-output.schema.json"

id = "webdav"
name = "WebDAV Plugin"
version = "0.3.4"
protocol_version = "1"
description = "WebDAV remote storage and file management plugin for VoidB."
license = "Apache-2.0"
homepage = "https://github.com/limmytian/voidb-plugin-webdav"

[runtime]
command = "voidb-plugin-webdav"
args = ["serve"]
transport = "stdio-jsonrpc"

[runtime.env]

[connections]
profile_schema = "schemas/profile.schema.json"
secret_classes = ["password"]

[[capabilities]]
id = "probe"
description = "Probe WebDAV COPY, MOVE, locking, and range-resume support without mutation."
input_schema = "schemas/probe-input.schema.json"
output_schema = "schemas/probe-output.schema.json"
permissions = [
    "connection.read",
    "webdav.probe",
]
risk = "read_only"
destructive = false
streaming = false
execution_mode = "stateless"
connection_required = true
required_secret_classes = []
supports_dry_run = false
default_timeout_ms = 30000

[capabilities.authorization]
declared = true
interactive_execute = false
session_purposes = []
note = "Remote path-prefix constraints are revalidated; resumable sessions remain deferred."
capability_wide_allowed = true

[capabilities.authorization.approval_schema]
version = 1

[[capabilities.authorization.approval_schema.fields]]
path = "/path"
label = "Remote path or prefix"
value_type = "path"
required = false
constraint = "prefix"
risk_emphasis = "normal"

[[capabilities]]
id = "list"
description = "List entries in a WebDAV directory."
input_schema = "schemas/list-input.schema.json"
output_schema = "schemas/list-output.schema.json"
permissions = [
    "connection.read",
    "webdav.list",
]
risk = "read_only"
destructive = false

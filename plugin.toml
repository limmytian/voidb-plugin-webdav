[capabilities.authorization]
declared = true
interactive_execute = false
session_purposes = []
note = "COPY/MOVE destination, overwrite, depth, ETag, and lock constraints are revalidated by the WebDAV service."
capability_wide_allowed = true

[capabilities.authorization.approval_schema]
version = 1

[[capabilities.authorization.approval_schema.fields]]
path = "/source"
label = "Source path"
value_type = "path"
required = true
constraint = "exact"
risk_emphasis = "normal"

[[capabilities.authorization.approval_schema.fields]]
path = "/destination"
label = "Destination path"
value_type = "path"
required = true
constraint = "exact"
risk_emphasis = "destructive"

[[capabilities.authorization.approval_schema.fields]]
path = "/overwrite"
label = "Overwrite destination"
value_type = "boolean"
required = false
constraint = "exact"
risk_emphasis = "destructive"

[[capabilities.authorization.approval_schema.fields]]
path = "/depth"
label = "Collection depth"
value_type = "string"
required = false
constraint = "exact"
risk_emphasis = "destructive"

[[capabilities]]
id = "sync_plan"
description = "Compute a local/WebDAV sync plan without applying changes."
input_schema = "schemas/sync_plan-input.schema.json"
output_schema = "schemas/sync_plan-output.schema.json"
permissions = [
    "connection.read",
    "webdav.sync_plan",
    "local.scan",
]
risk = "read_only"
destructive = false
streaming = false
execution_mode = "stateless"
connection_required = true
required_secret_classes = []
supports_dry_run = false

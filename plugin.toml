[[capabilities.authorization.approval_schema.fields]]
path = "/destination"
label = "Destination path"
value_type = "path"
required = true
constraint = "exact"
risk_emphasis = "destructive"

[[capabilities.authorization.approval_schema.fields]]
path = "/overwrite"
label = "Overwrite destination"
value_type = "boolean"
required = false
constraint = "exact"
risk_emphasis = "destructive"

[[capabilities.authorization.approval_schema.fields]]
path = "/depth"
label = "Collection depth"
value_type = "string"
required = false
constraint = "exact"
risk_emphasis = "destructive"

[[capabilities]]
id = "move"
description = "MOVE a WebDAV resource with explicit overwrite and ETag preconditions."
input_schema = "schemas/move-input.schema.json"

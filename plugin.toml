label = "Remote path or prefix"
value_type = "path"
required = true
constraint = "prefix"
risk_emphasis = "normal"

[[capabilities.authorization.approval_schema.fields]]
path = "/local_root"
label = "Approved local scan root"
value_type = "path"
required = true
constraint = "exact"
risk_emphasis = "privilege_escalation"

[[capabilities.authorization.approval_schema.fields]]
path = "/local_path"
label = "Relative local scan path"
value_type = "path"
required = true
constraint = "exact"
risk_emphasis = "normal"

[[capabilities.authorization.approval_schema.fields]]
path = "/disclose_relative_paths"
label = "Disclose relative local paths"
value_type = "boolean"
required = false
constraint = "exact"
risk_emphasis = "privilege_escalation"

[[capabilities]]
id = "transfer"
description = "Run a cancellable WebDAV upload, resumable download, COPY, or MOVE inside a plugin-owned session."
input_schema = "schemas/transfer-input.schema.json"
output_schema = "schemas/transfer-output.schema.json"
permissions = [
    "connection.read",
    "connection.write",
    "local.read",
    "local.write",
    "webdav.transfer",
]
risk = "destructive"
destructive = true
streaming = true
execution_mode = "session_only"
connection_required = true
required_secret_classes = []
supports_dry_run = false
default_timeout_ms = 900000

[capabilities.authorization]
declared = true
interactive_execute = true
note = "Remote paths, local scope, overwrite, ETag, range-resume, and lock ownership are revalidated inside the WebDAV session."
capability_wide_allowed = false

[[capabilities.authorization.session_purposes]]
kind = "file_transfer"

[capabilities.authorization.approval_schema]
version = 1

[[capabilities.authorization.approval_schema.fields]]
path = "/operation"
label = "Transfer operation"
value_type = "string"
required = true
constraint = "exact"
risk_emphasis = "destructive"

[[capabilities.authorization.approval_schema.fields]]
path = "/path"
label = "Source path"
value_type = "path"
required = true
constraint = "exact"
risk_emphasis = "normal"

[[capabilities.authorization.approval_schema.fields]]
path = "/destination"
label = "Destination path"
value_type = "path"
required = false
constraint = "exact"
risk_emphasis = "destructive"

[[capabilities.authorization.approval_schema.fields]]
path = "/local_root"
label = "Approved local transfer root"
value_type = "path"
required = false
constraint = "exact"
risk_emphasis = "privilege_escalation"

[[capabilities.authorization.approval_schema.fields]]
path = "/local_path"
label = "Relative local transfer path"
value_type = "path"
required = false
constraint = "exact"
risk_emphasis = "normal"

[[capabilities.authorization.approval_schema.fields]]
path = "/overwrite"
label = "Overwrite destination"
value_type = "boolean"
required = false
constraint = "exact"
risk_emphasis = "destructive"

[[capabilities.authorization.approval_schema.fields]]
path = "/lock_ref"
label = "Session-owned lock reference"
value_type = "resource_id"
required = false
constraint = "exact"
risk_emphasis = "normal"

[capabilities.session_handoff]
capabilities = [
    "webdav.transfer",
    "webdav.transfer_status",
    "webdav.lock_acquire",
    "webdav.lock_release",
]

[capabilities.session_handoff.purpose]
kind = "file_transfer"

[[capabilities]]
id = "transfer_status"
description = "Read the latest bounded WebDAV transfer lifecycle event without blocking the transfer."
input_schema = "schemas/transfer_status-input.schema.json"
output_schema = "schemas/transfer_status-output.schema.json"
permissions = [
    "connection.read",
    "webdav.transfer_status",
]
risk = "read_only"
destructive = false
streaming = true
execution_mode = "session_only"
connection_required = true
required_secret_classes = []
supports_dry_run = false
default_timeout_ms = 5000

[capabilities.authorization]
declared = true
interactive_execute = false
note = "Status exposes only the redacted shared transfer lifecycle."
capability_wide_allowed = true

[[capabilities.authorization.session_purposes]]
kind = "file_transfer"

[capabilities.session_handoff]
capabilities = [
    "webdav.transfer",
    "webdav.transfer_status",
    "webdav.lock_acquire",
    "webdav.lock_release",
]

[capabilities.session_handoff.purpose]
kind = "file_transfer"

[[capabilities]]
id = "lock_acquire"
description = "Acquire a bounded WebDAV exclusive write lock retained only inside this session."
input_schema = "schemas/lock_acquire-input.schema.json"
output_schema = "schemas/lock_acquire-output.schema.json"
permissions = [
    "connection.write",
    "webdav.lock_acquire",
]
risk = "external_side_effect"
destructive = false
streaming = false
execution_mode = "session_only"
connection_required = true
required_secret_classes = []
supports_dry_run = false
default_timeout_ms = 30000

[capabilities.authorization]
declared = true
interactive_execute = true
capability_wide_allowed = false

[[capabilities.authorization.session_purposes]]
kind = "file_transfer"

[capabilities.authorization.approval_schema]
version = 1

[[capabilities.authorization.approval_schema.fields]]
path = "/path"
label = "Acquire WebDAV lock"
value_type = "path"
required = true
constraint = "exact"
risk_emphasis = "privilege_escalation"

[[capabilities.authorization.approval_schema.fields]]
path = "/timeout_seconds"
label = "Lock lifetime"
value_type = "integer"
required = false
constraint = "exact"
risk_emphasis = "privilege_escalation"

[capabilities.session_handoff]
capabilities = [
    "webdav.transfer",
    "webdav.transfer_status",
    "webdav.lock_acquire",
    "webdav.lock_release",
]

[capabilities.session_handoff.purpose]
kind = "file_transfer"

[[capabilities]]
id = "lock_release"
description = "Release a WebDAV lock owned by this session using its opaque lock reference."
input_schema = "schemas/lock_release-input.schema.json"
output_schema = "schemas/lock_release-output.schema.json"
permissions = [
    "connection.write",
    "webdav.lock_release",
]
risk = "external_side_effect"
destructive = false
streaming = false
execution_mode = "session_only"
connection_required = true
required_secret_classes = []
supports_dry_run = false
default_timeout_ms = 30000

[capabilities.authorization]
declared = true
interactive_execute = true
note = "Only locks owned by the active session can be released."
capability_wide_allowed = true

[[capabilities.authorization.session_purposes]]
kind = "file_transfer"

[capabilities.session_handoff]
capabilities = [
    "webdav.transfer",
    "webdav.transfer_status",
    "webdav.lock_acquire",
    "webdav.lock_release",
]

[capabilities.session_handoff.purpose]
kind = "file_transfer"

[ui]
tui = true
raw_input = false

[requirements]
voidb_core = ">=0.3.3"
platforms = [
    "darwin",
    "linux",
    "windows",
]
